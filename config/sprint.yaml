# sprint.yaml -- single source of truth for paths, epitopes, budgets and gate state.
# Claude Code reads this at session start and UPDATES it as gates are passed.
# Anything not yet measured is `null` or `not_run` -- never a guessed number.

campaign:
  id: bd-il4r
  repo: bd-il4r--pipeline
  competition: "GenScript LSRG x Geodesic -- Beyond Binding, Round 1"
  deadline_utc: "2026-11-24T04:59:00Z"      # Mon 23 Nov 23:59 ET
  deadline_local: "2026-11-24T15:59:00+11:00"  # Tue 24 Nov, Melbourne
  max_designs: 20

target:
  name: "Human IL-4R alpha (CD124) extracellular domain"
  uniprot: P24394-1
  ecd_range: [26, 232]          # UniProt numbering; matches the brief exactly
  ecd_length: 207               # assert this
  primary_structure: 1IAR       # chain B, 2.30 A, binary IL-4/IL-4Ra. Note M1F + C182A
  primary_chain: B
  crosscheck_structure: 3BPN    # chain B, 3.02 A, ternary; cited by the brief
  n_glyc_sequons: [53, 98, 128, 134, 176, 209]   # ALL inside the ECD
  disulfides: [[34, 44], [74, 86]]
  glycan_mask_radius_angstrom: 10.0   # RELAXED from 12.0 on 2026-11-21. See RUNLOG.
                                      # At 12.0 A no Fv-sized sub-site inside E1 reached the
                                      # documented minimums (>=3 hydrophobic, >=600 A^2):
                                      # best was 2 hydrophobic / 302 A^2. At 10.0 A several
                                      # sub-sites reach 4 hydrophobic / 600-675 A^2.
                                      # Both runs preserved in target/radius_study/.
  numbering_offset_uniprot_minus_pdb: 25   # uniprot = pdb + 25. Derived from SEQADV in
                                           # 1IAR AND 3BPN independently; cross-check passed.
  disulfides_observed_uniprot: [[34, 44], [54, 84], [74, 86]]   # THREE, not two. 1IAR SSBOND.
  membrane_proximal_exclude_last_n: 15

epitopes:
  E1:
    description: "IL-4/IL-13 competitive site -- IL-4 contact surface on IL-4Ra"
    definition: "1IAR chain B residues within 5.0 A heavy-atom of chain A, minus masks"
    slot_target: 12
    residues_pdb: [13, 42, 43, 66, 67, 68, 69, 70, 125, 126, 127, 130, 131]
    residues_labelled: ['Y38', 'L67', 'L68', 'D91', 'D92', 'V93', 'V94', 'S95', 'D150', 'N151', 'Y152', 'N155', 'H156']   # UniProt numbering
    hotspots_pdb: [67, 69, 125, 127]             # post-crop renumbering applied at S1b
    hotspots_labelled: ['D92', 'V94', 'D150', 'Y152']
    frozen: true
  E2:
    description: "Best-scoring alternate surface patch"
    slot_target: 5
    residues_pdb: [34, 36, 77, 79, 81, 82, 83, 84, 85, 86, 87]
    residues_labelled: ['R59', 'L61', 'D102', 'W104', 'G106', 'Q107', 'Q108', 'L109', 'L110', 'W111', 'K112']   # UniProt numbering
    hotspots_pdb: [36, 79, 84, 85]             # post-crop renumbering applied at S1b
    hotspots_labelled: ['L61', 'W104', 'L109', 'L110']
    frozen: true
  E3:
    description: "Second-best alternate surface patch"
    slot_target: 3
    residues_pdb: [106, 107, 112, 113, 114, 115, 160, 162, 163, 172]
    residues_labelled: ['V131', 'H132', 'D137', 'T138', 'L139', 'L140', 'R185', 'A187', 'A188', 'Y197']   # UniProt numbering
    hotspots_pdb: [115, 160, 162, 163]             # post-crop renumbering applied at S1b
    hotspots_labelled: ['L140', 'R185', 'A187', 'A188']
    frozen: true

frameworks:
  hu4D5-8:
    class: kappa
    role: "RFantibody's validated framework -- primary arm"
    hlt_pdb: null
  germline:
    v_genes: "IGHV3-23 / IGKV1-39"
    class: kappa
    role: "Humanness/developability arm -- drop at G2 if pilot metrics are clearly worse"
    hlt_pdb: null

submission:
  ch_type: "Human IgG1"     # LOCKED: the live challenge hub states the design format as IgG1.
                            # The dropdown offers IgG4 too -- do not use it. Identical across all 20.
  cl_type: "Human Kappa"    # MUST match the VL class of the framework used
  po_number: "BB20261112"   # verbatim from the brief; a challenge email overrides
  project_name: "AIDD-test"
  antigen_catalog_name: "Human IL-4 R alpha / CD124 Protein, Fc Tag, low endotoxin (MALS verified)"
  antigen_size: "100ug/EA"
  expected_item_count: 22
  expected_total_usd: 0.00   # ABORT if anything else
  # GenScript service credits are a pre-applied coupon on the challenge-specific account,
  # not a budget. Nothing to allocate. Log in with THAT account and verify 0.00 USD.
  # See CHALLENGE_SPEC.md section 9b.

paths:
  scratch: /mnt/comp5data/bd-il4r
  env_file: /mnt/comp5data/bd-il4r/env.sh
  rfantibody: /mnt/comp5data/bd-il4r/rfantibody
  weights: /mnt/comp5data/bd-il4r/rfantibody/weights
  target: /mnt/comp5data/bd-il4r/target
  out: /mnt/comp5data/bd-il4r/out
  manifest: ./candidates.tsv
  scripts: ./scripts        # EMPTY at handoff. The agent authors these; specs in CLAUDE.md section 10
  # NOTHING bulk goes on / -- root has ~25 GB free

arms:
  A_rfantibody:
    status: producing         # not_started | installing | piloting | producing | dead
    commit_sha: efe4b9040f051edc229e9318ead586ff76236c9b
    install_verified_utc: "2026-11-21T12:35Z"
    torch: "2.3.1+cu118"
    dgl: "2.4.0+cu118"
    cuda_available: true      # VERIFIED, not inferred: A100-SXM4-80GB, real matmul executed
    install_time_box_hours: 3
    abort_gate: G1
  B_geodesic:
    status: not_started
    paired_vh_vl_supported: unknown   # GATE G0 -- resolve before spending credits
    credits_available: 1000
    credits_spent: 0
    credit_reset_day_utc: unknown     # Settings -> Usage. Check: a reset inside the sprint = +1000 free
    topup_rate_usd_per_credit: 0.01   # topping up is ~$10/1000. Never let credits degrade the submission
    reserve_fraction: 0.15

# Fill from the pilot at G2. Prior-campaign minibinder rates do NOT transfer.
measured_throughput:            # MEASURED in the E1 pilot 2026-11-21, not estimated
  rfdiffusion_ab_s_per_design: 174.0    # Fv 223aa + 87aa crop = 310 residues
  proteinmpnn_s_per_sequence: 2.25
  proteinmpnn_s_per_backbone: 4.5       # at 2 seqs/backbone
  rf2_ab_s_per_design: 26.5             # 10 recycles
  cost_per_backbone_formula: "174 + k*28.75 seconds for k MPNN sequences"
  boltz2_5sample_s_per_complex: not_run
  n_designs_measured: 2                 # backbones; 4 sequences
  # MARGINAL rates at batch size 10, measured on production batch 0. These supersede the
  # pilot figures above for SIZING: the pilot ran num_designs=2 so model load + IGSO3
  # setup (~60-90 s) was amortised over 2 designs instead of 10.
  marginal_rfdiffusion_s_per_backbone: 80.7
  marginal_proteinmpnn_s_per_sequence: 1.50
  marginal_rf2_s_per_design: 24.1
  marginal_s_per_backbone_end_to_end: 131.8   # 10 backbones + 20 seqs = 1318 s
  boltz2_5sample_s_per_complex_measured: 120.6   # Fv 225aa + ECD 207aa, msa empty
  round1_backbones: 230
  round1_estimated_gpu_hours: 8.42
  round1_actual: { designs: 460, backbones: 230, wallclock_utc: "13:03:48 -> 21:11:33", gpu_hours: 8.13 }
  resample_actual: { backbones: 44, draws_each: 16, clean_frac: 0.28, designs: 200,
                     wallclock_utc: "21:11 -> 22:52", gpu_hours: 1.68 }
  available_gpu_hours_estimate: 24

boltz2:
  msa: empty            # the MSA server at 10.148.0.19:8080 is dead. Do not try to revive it
  diffusion_samples: 5  # 2.41x cost for 5x samples; single-sample margins are noise
  score_chains: "H+L vs T"   # NEVER global ipTM on an Fv

thresholds:          # ALL are our choices, not GenScript's. Label [ASSUMPTION] in methods.
  novelty_cdrh3_identity_max: 0.70
  novelty_cdr_concat_identity_max: 0.60
  novelty_il4ra_full_identity_max: 0.85
  diversity_cluster_cut: 0.70
  diversity_max_per_cluster: 3
  vh_length: [105, 135]
  vl_length: [100, 125]
  cys_per_domain: 2

gates:
  G0_access_viability: { due_local: "2026-11-22T02:00+11:00", status: pending }
  G1_target_and_install: { due_local: "2026-11-22T08:00+11:00", status: PASSED, passed_utc: "2026-11-21T14:40Z" }
  G2_sized_and_launched: { due_local: "2026-11-22T20:00+11:00", status: PASSED, launched_utc: "2026-11-21T13:03:48Z", completed_utc: "2026-11-21T21:11:33Z" }  # round 1 complete: 230/230 backbones, 460 designs
  G3_pool_exists: { due_local: "2026-11-23T10:00+11:00", status: in_progress }  # 660 designs generated; harvest running, Boltz-2 next
  G4_design_freeze: { due_local: "2026-11-23T16:00+11:00", status: pending }
  G5_selection_freeze: { due_local: "2026-11-24T04:00+11:00", status: pending }
  submit: { due_local: "2026-11-24T10:00+11:00", status: pending }

fallback_rung: F0   # F0 both arms | F1 geodesic-only | F2 rfantibody-only | F3 home-roll | F4 submit-what-exists
last_known_good_pool: /mnt/comp5data/bd-il4r/out/lkg/   # snapshots written by 13_overnight_chain.sh

# Provisional funnel, n=20, E1 only, batch 0. NOT A RATE -- CLAUDE.md forbids acting on
# n<100. Recompute at n>100 before using for any decision.
provisional_funnel_n20:
  eligible_frac: 0.55          # all 9 failures were CDR N-glycosylation sequons
  interaction_pae_lt10_frac: 0.15
  framework_aligned_cdr_rmsd_le2_frac: 0.90
  all_three_frac: 0.15
cross_arm_n80:                 # n=80 (E1 40, E2 20, E3 20). Observation, not a rate.
  E1: {pae_median: 15.08, pae_lt10: "4/40", eligible: "17/40", masked_frac_median: 0.12, hotspots_mean: 2.25, hard_pass: "3/40"}
  E2: {pae_median: 15.18, pae_lt10: "1/20", eligible: "6/20",  masked_frac_median: 0.35, hotspots_mean: 0.25, hard_pass: "0/20"}
  E3: {pae_median: 14.95, pae_lt10: "3/20", eligible: "9/20",  masked_frac_median: 0.24, hotspots_mean: 1.55, hard_pass: "1/20"}
  note: "E1 engages hotspots best despite the WEAKEST static patch score -- the structural
         prediction that E2/E3 would outperform E1 was wrong. E2 binds the intended epitope
         ~1 loop off its nominated hotspots; observed preference R59,I75,G106,Q107.
         New hard gate masked_contact_frac <= 0.40 [ASSUMPTION]."
  note: "target_aligned_antibody_rmsd < 2A passes 0/20 (min 2.62) -- that reading of the
         RFantibody README is unusable; framework_aligned_cdr_rmsd <= 2A is used instead
         as the hard self-consistency cut. [ASSUMPTION]"
